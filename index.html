<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter From My Heart 💜</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#12001f,#2a0a45,#4b1877,#6b21a8);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-y:auto;
}

/* 🌧️ REAL RAIN */
#rain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
}

.drop{
    position:absolute;
    bottom:100%;
    width:1px;
    height:80px;
    background:linear-gradient(transparent,rgba(255,255,255,0.7));
    animation:fall linear infinite;
    opacity:0.5;
}

@keyframes fall{
    to{
        transform:translateY(120vh);
    }
}

/* ⚡ FLASH */
.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:2;
}

/* 💜 MAIN CARD */
.container{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:40px;
    z-index:3;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    margin:40px 0;
}

h1{
    text-align:center;
    color:#e9ccff;
    margin-bottom:25px;
}

/* TEXT */
.message{
    white-space:pre-wrap;
    line-height:2;
    font-size:1rem;
    min-height:420px;
}

.cursor{
    display:inline-block;
    width:2px;
    background:white;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

/* FOOTER */
.footer{
    margin-top:25px;
    text-align:center;
    color:#f0d9ff;
    font-style:italic;
}

/* HEARTS */
.heart{
    position:fixed;
    color:#c084fc;
    animation:floatUp 10s linear forwards;
    pointer-events:none;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{opacity:.7;}
    to{
        transform:translateY(-120px);
        opacity:0;
    }
}

/* CLOSING */
.closing{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:20px;
}

.closing-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    padding:30px;
    border-radius:20px;
    max-width:500px;
    text-align:center;
}

.closing-card h2{
    color:#e6ccff;
    margin-bottom:15px;
}

.closing-card p{
    margin-bottom:10px;
    line-height:1.7;
}

.soft{
    font-style:italic;
    color:#f0d9ff;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#a855f7;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- 🌧️ RAIN -->
<div id="rain"></div>

<!-- ⚡ THUNDER -->
<div class="flash" id="flash"></div>

<div class="container">
    <h1>💜 A Letter From My Heart 💜</h1>

    <div class="message">
        <span id="typed"></span><span class="cursor"></span>
    </div>

    <div class="footer">
        Purple always reminds me of you. 💜
    </div>
</div>

<!-- 💌 CLOSING -->
<div id="closingScreen" class="closing">
  <div class="closing-card">
    <h2>💜 That’s all I wanted to say</h2>

    <p>I don’t expect a reply, and I respect your space.</p>

    <p>If you ever feel comfortable speaking again, even just as friends, I’d really appreciate it.</p>

    <p class="soft">No pressure at all. Take care of yourself.</p>

    <button onclick="closeScreen()">Close</button>
  </div>
</div>

<script>

/* 📜 LETTER */
const text = `I know you may not want to hear from me, and I want to respect your space.

But I've been doing a lot of reflecting, and I felt I needed to reach out and tell you how deeply sorry I am.

I know I messed up something really special.

Looking back, I realize that some of my actions were thoughtless, and I hate knowing that I caused you pain.

I've missed you, and I've been struggling with the distance between us.

I still care about you deeply, but more than anything, I want to become better.

I’m not asking for everything to be the same.

I just wanted to say I’m sorry.

If you ever feel like talking again, even just as friends, I’d appreciate it.

Take care. 💜`;

let i = 0;
const speed = 28;

/* TYPE + AUTO SCROLL */
function typeWriter(){
    if(i < text.length){
        document.getElementById("typed").innerHTML += text.charAt(i);
        i++;

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

        setTimeout(typeWriter, speed);
    } else {
        setTimeout(showClosing, 1200);
    }
}

/* CLOSING */
function showClosing(){
    document.getElementById("closingScreen").style.display = "flex";
}

function closeScreen(){
    document.getElementById("closingScreen").style.display = "none";
}

/* 🎵 MUSIC (starts immediately on first click) */
let audio = new Audio("river.mp3");
audio.loop = true;
audio.volume = 0.25;

function startMusic(){
    audio.play().catch(()=>{});
}

/* starts instantly on first interaction anywhere */
document.addEventListener("click", function initMusic(){
    startMusic();
    document.removeEventListener("click", initMusic);
});

/* 🌧️ REAL RAIN */
function createRain(){
    const rain = document.getElementById("rain");

    for(let i = 0; i < 120; i++){
        let drop = document.createElement("div");
        drop.classList.add("drop");

        drop.style.left = Math.random() * 100 + "vw";
        drop.style.animationDuration = (0.5 + Math.random()) + "s";
        drop.style.opacity = Math.random();

        rain.appendChild(drop);
    }
}

createRain();

/* ⚡ THUNDER */
function thunder(){
    const flash = document.getElementById("flash");

    setInterval(()=>{
        if(Math.random() > 0.92){
            flash.style.opacity = "0.35";
            setTimeout(()=>flash.style.opacity = "0", 120);
        }
    },4000);
}

thunder();

/* 🚀 START */
typeWriter();

/* 💜 HEARTS */
function createHeart(){
    const heart = document.createElement("div");
    heart.innerHTML = "💜";
    heart.classList.add("heart");
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (14 + Math.random()*20) + "px";

    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
}

setInterval(createHeart,900);

</script>

</body>
</html>
