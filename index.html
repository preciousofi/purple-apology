<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Letter From My Heart 💜</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* IMPORTANT FIX: allow scrolling */
body{
    background:linear-gradient(135deg,#0b0012,#1d0830,#3b0f5c);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
}

/* INTRO */
#intro{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:10;
}

.intro-text{
    font-size:18px;
    color:#d8b4fe;
    opacity:0;
    animation:fadeIn 3s forwards;
}

.title{
    font-size:26px;
    color:#f0d9ff;
    margin-top:20px;
    opacity:0;
    animation:fadeIn 3s forwards;
    animation-delay:2.5s;
}

@keyframes fadeIn{
    to{opacity:1;}
}

/* RAIN */
#rain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:0;
    transition:2s;
}

.drop{
    position:absolute;
    width:1px;
    height:80px;
    background:linear-gradient(transparent,rgba(255,255,255,.7));
    animation:fall linear infinite;
}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(120vh);}
}

/* THUNDER */
.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:2;
    transition:.15s;
}

/* LETTER CONTAINER */
#container{
    position:relative;
    z-index:5;
    max-width:800px;
    margin:auto;
    padding:60px 20px;
    display:none;
}

/* TITLE */
h1{
    text-align:center;
    color:#f0d9ff;
    margin-bottom:40px;
    letter-spacing:1px;
}

/* TEXT */
#text{
    white-space:pre-wrap;
    font-size:17px;
    line-height:2;
    color:#f5e9ff;
}

/* FOOTER */
.footer{
    margin-top:50px;
    text-align:center;
    color:#d8b4fe;
    font-size:14px;
}
</style>
</head>
<body>
<!-- INTRO -->
<div id="intro">
    <div class="intro-text">A message she was never supposed to see...</div>
    <div class="title">💜 A Letter From My Heart 💜</div>
</div>
<div id="rain"></div>
<div id="flash" class="flash"></div>
<!-- LETTER -->
<div id="container">
    <h1>💜 A Letter From My Heart 💜</h1>
    <div id="text"></div>
    <div class="footer" id="footer"></div>
</div>
<script>

/* INTRO */
setTimeout(()=>{
    document.getElementById("intro").style.transition="2s";
    document.getElementById("intro").style.opacity="0";

    setTimeout(()=>{
        document.getElementById("intro").style.display="none";
        startScene();
    },2000);

},5500);

/* RAIN */
function startRain(){
    const rain=document.getElementById("rain");
    rain.style.opacity="1";

    for(let i=0;i<120;i++){
        const drop=document.createElement("div");
        drop.classList.add("drop");
        drop.style.left=Math.random()*100+"vw";
        drop.style.opacity=Math.random();
        drop.style.animationDuration=(0.6+Math.random())+"s";
        rain.appendChild(drop);
    }

    setInterval(()=>{
        if(Math.random()>0.9){
            const flash=document.getElementById("flash");
            flash.style.opacity="0.3";
            setTimeout(()=>flash.style.opacity="0",150);
        }
    },4000);
}

/* LETTER TEXT */
const text = `
I know you may not want to hear from me, and I want to respect your space.

But I’ve been doing a lot of reflecting, and I needed to reach out and tell you how deeply sorry I am.

I know I hurt you. I know my actions were thoughtless, and I hate that I became the reason for your pain.

I truly didn’t intend for things to turn out this way, but I understand that doesn’t change the impact.

I know I messed up something really special… someone I love… and I take full responsibility for that.

I’ve been thinking a lot about everything. About what I did wrong. About how I made you feel. About what I should have done better.

I miss you. Not just the idea of you — but you.

I remember our first cinema date. You holding my hand because the movie got emotional. It was such a small moment, but it stayed with me.

I remember our second date… how natural everything felt, how easy it was to talk to you.

I remember you ranting to me about your day — your thoughts, your stress, your happiness. And I genuinely loved listening.

I remember the laughter, the conversations, and the comfort we shared.

I miss all of it.

I regret ruining something that meant so much to me.

If I could go back and fix my mistakes, I would.

But I can’t change the past.

You are someone I truly love. Someone who meant a lot to me in ways I didn’t fully understand at the time.

You made life feel lighter just by being in it.

I’m not asking for everything to go back to how it was.

I know trust takes time. I know healing takes time.

But if you’re ever comfortable with it, I’d love for us to be on good terms again. Maybe even friends.

No pressure to reply.

I just wanted you to know how I feel.

Thank you for the memories…

Purple will always remind me of you 💜
`;

let i=0;
const speed=22;

function startScene(){
    document.getElementById("container").style.display="block";
    startRain();
    typeWriter();
}

/* TYPING */
function typeWriter(){
    if(i < text.length){
        document.getElementById("text").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    } else {
        document.getElementById("footer").innerHTML="Take care of yourself 💜";
    }
}

</script>
</body>
</html>
